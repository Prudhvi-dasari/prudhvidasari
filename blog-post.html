<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title id="pageTitle">Article — Prudhvi</title>
  <meta name="description" content="" id="pageMeta"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="blogs-data.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-blog.js"></script>
  <style>
    .post-hero { padding:140px 24px 60px; max-width:780px; margin:0 auto; }
    .back-link { display:inline-flex; align-items:center; gap:8px; color:var(--muted); text-decoration:none; font-size:.9rem; margin-bottom:40px; transition:color .2s; }
    .back-link:hover { color:var(--accent2); }
    .post-meta { display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:24px; }
    .post-cat { background:rgba(29,110,245,0.15); border:1px solid rgba(29,110,245,0.3); color:var(--accent2); padding:6px 16px; border-radius:100px; font-size:.8rem; font-weight:600; }
    .post-meta span { color:var(--muted); font-size:.85rem; font-family:var(--mono); }
    .post-title { font-size:clamp(2rem,5vw,3.2rem); font-weight:900; letter-spacing:-2px; line-height:1.1; margin-bottom:32px; }
    .post-divider { height:1px; background:var(--border); margin-bottom:48px; }
    .post-content { max-width:780px; margin:0 auto; padding:0 24px 100px; font-family:'Lora',Georgia,serif; font-size:1.1rem; line-height:1.85; color:#c8d4f0; }
    .post-content h2 { font-family:var(--font); font-size:1.6rem; font-weight:800; color:var(--text); margin:48px 0 16px; letter-spacing:-1px; }
    .post-content h3 { font-family:var(--font); font-size:1.2rem; font-weight:700; color:var(--text); margin:32px 0 12px; }
    .post-content p { margin-bottom:24px; }
    .post-content strong { color:var(--accent2); font-family:var(--font); }
    .post-content em { color:var(--text); }
    .post-content a { color:var(--accent2); }
    .post-content ul, .post-content ol { padding-left:24px; margin-bottom:24px; }
    .post-content li { margin-bottom:10px; }
    .post-content blockquote { border-left:3px solid var(--accent); padding:16px 24px; background:rgba(29,110,245,0.07); border-radius:0 12px 12px 0; margin:32px 0; font-style:italic; color:var(--text); }
    .post-content code { font-family:var(--mono); background:rgba(255,255,255,0.07); padding:2px 8px; border-radius:6px; font-size:.9em; color:var(--gold); }
    .post-content pre { background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:12px; padding:24px; overflow-x:auto; margin-bottom:24px; }
    .post-content pre code { background:none; padding:0; }
    .post-cover-img { width:100%; height:360px; object-fit:cover; border-radius:var(--radius); margin-bottom:48px; display:block; }
    .post-cover-emoji { height:220px; display:flex; align-items:center; justify-content:center; font-size:5rem; background:linear-gradient(135deg,var(--c1,#1d6ef5),var(--c2,#0ea5e9)); border-radius:var(--radius); margin-bottom:48px; max-width:780px; margin-left:auto; margin-right:auto; }
    .not-found { text-align:center; padding:120px 24px; }
    .not-found h2 { font-size:2rem; margin-bottom:16px; }
    .not-found p { color:var(--muted); margin-bottom:32px; }
    .share-bar { max-width:780px; margin:0 auto; padding:0 24px 60px; border-top:1px solid var(--border); padding-top:40px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
    .share-bar p { color:var(--muted); font-size:.9rem; }
    .share-btns { display:flex; gap:10px; }
    .share-btn { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:8px 18px; border-radius:100px; font-size:.85rem; cursor:pointer; font-family:var(--font); text-decoration:none; transition:all .2s; }
    .share-btn:hover { border-color:var(--accent2); color:var(--accent2); }
  </style>
</head>
<body>
  <div class="noise"></div>

  <nav class="nav scrolled">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">PRUDHVI<span class="dot">.</span></a>
      <ul class="nav-links">
        <li><a href="index.html#about" class="nav-link">About</a></li>
        <li><a href="index.html#projects" class="nav-link">Projects</a></li>
        <li><a href="blog.html" class="nav-link" style="color:var(--text)">Blog</a></li>
        <li><a href="index.html#contact" class="nav-link">Contact</a></li>
      </ul>
      <a href="index.html#contact" class="nav-cta">Let's Work</a>
    </div>
  </nav>

  <div id="postWrap"></div>

  <footer class="footer">
    <div class="container footer-inner">
      <a href="index.html" class="nav-logo">PRUDHVI<span class="dot">.</span></a>
      <div class="footer-links">
        <a href="blog.html">← All Articles</a>
        <a href="index.html#contact">Contact</a>
      </div>
      <p class="footer-copy">© 2025 Prudhvi · growinnerself.ai · Just One Life</p>
    </div>
  </footer>

  <script src="blogs-data.js"></script>
  <script>
    function getBlogs() {
      const stored = localStorage.getItem('prudhvi_blogs');
      if (stored) return JSON.parse(stored);
      const seed = window.BLOGS_SEED || [];
      localStorage.setItem('prudhvi_blogs', JSON.stringify(seed));
      return seed;
    }

    const CATEGORY_COLORS = {
      "Freelancing":"#1d6ef5,#0ea5e9","Web Dev":"#0891b2,#1d6ef5","Video Edit":"#7c3aed,#4f46e5",
      "Behind the Build":"#f97316,#eab308","Social Media":"#db2777,#9333ea","Branding":"#10b981,#0891b2"
    };
    const CATEGORY_EMOJIS = {"Freelancing":"💼","Web Dev":"🌐","Video Edit":"🎬","Behind the Build":"🚀","Social Media":"📱","Branding":"🎨","default":"✍️"};

    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');
    const wrap = document.getElementById('postWrap');

    BlogDB.getOne(postId, function(post, fromFirebase) {
      if (!post) {
        if (!fromFirebase) return; // wait for Firebase response before showing not-found
        wrap.innerHTML = `<div class="not-found"><h2>Article not found</h2><p>It may have been moved or deleted.</p><a href="blog.html" class="btn-primary" style="display:inline-flex">← Back to Blog</a></div>`;
        return;
      }
      document.title = `${post.title} — Prudhvi`;
      document.getElementById('pageMeta').content = post.excerpt;
      const colors = CATEGORY_COLORS[post.category] || '#1d6ef5,#38bdf8';
      const [c1,c2] = colors.split(',');
      const coverHTML = post.cover
        ? `<img src="${post.cover}" alt="${post.title}" class="post-cover-img" />`
        : `<div class="post-cover-emoji" style="--c1:${c1};--c2:${c2}">${CATEGORY_EMOJIS[post.category]||'✍️'}</div>`;

      wrap.innerHTML = `
        <div class="post-hero">
          <a href="blog.html" class="back-link">← Back to all articles</a>
          ${coverHTML}
          <div class="post-meta">
            <span class="post-cat">${post.category}</span>
            <span>${post.readTime} read</span>
            <span>${post.date}</span>
          </div>
          <h1 class="post-title">${post.title}</h1>
          <div class="post-divider"></div>
        </div>
        <div class="post-content">${post.content}</div>
        <div class="share-bar">
          <p>Found this useful? Share it.</p>
          <div class="share-btns">
            <a class="share-btn" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(post.title)}&url=${encodeURIComponent(window.location.href)}" target="_blank">Twitter / X</a>
            <a class="share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(window.location.href)}" target="_blank">LinkedIn</a>
            <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href);this.textContent='Copied!';setTimeout(()=>this.textContent='Copy Link',2000)">Copy Link</button>
          </div>
        </div>`;
    });
  </script>
</body>
</html>
